name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  FLUTTER_VERSION: "3.47.9"

jobs:
  server:
    name: Server (fmt, clippy, tests on SQLite + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: larder_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
        env:
          LARDER_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/larder_test

  app:
    name: Flutter app (analyze, test, web + Android builds)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo install cargo-ndk --locked
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build on-device engine (host + Android ABIs)
        run: |
          tool/build_engine.sh --host
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" tool/build_engine.sh
      - run: flutter pub get
      - run: flutter analyze
      - name: Tests (including real-engine integration tests)
        run: flutter test
        env:
          LARDER_ENGINE_LIB: ${{ github.workspace }}/server/target/release/liblarder_engine.so
      - run: flutter build web --release --no-web-resources-cdn
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: larder-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: larder-web
          path: app/build/web

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [server, app]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: larder:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
