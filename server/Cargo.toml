[workspace]
resolver = "2"
members = ["crates/core", "crates/import", "crates/cookbook", "crates/assist", "crates/engine", "crates/server"]

[workspace.package]
version = "0.1.6"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli", "multipart"] }
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
larder-core = { path = "crates/core" }
larder-import = { path = "crates/import" }
larder-cookbook = { path = "crates/cookbook" }
larder-assist = { path = "crates/assist" }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false
