[package]
name = "larder-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "On-device engine for the Larder Android app (standalone mode), exposed over a C ABI"

[lib]
name = "larder_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
larder-core.workspace = true
larder-import.workspace = true
larder-cookbook.workspace = true
larder-assist.workspace = true
anyhow.workspace = true
image.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
uuid.workspace = true

[dev-dependencies]
tempfile = "3"
