site_name: Larder
site_description: A recipe manager and cookbook for Android and the web, with or without a server.
site_url: https://larrydewey.github.io/Larder/
repo_url: https://github.com/larrydewey/Larder
repo_name: larrydewey/Larder
edit_uri: edit/master/website/docs/
copyright: Larder is MIT licensed.

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - def_list
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

nav:
  - Home: index.md
  - Getting started:
      - getting-started/index.md
      - Choosing how to run Larder: getting-started/choosing.md
      - Install the server: getting-started/server.md
      - Install the Android app: getting-started/android.md
      - First steps: getting-started/first-steps.md
  - User guide:
      - guide/index.md
      - Recipes: guide/recipes.md
      - Trial recipes: guide/trial.md
      - Editing recipes: guide/editing.md
      - Organizing recipes: guide/organize.md
      - Scaling & units: guide/scaling.md
      - Cook mode: guide/cook-mode.md
      - Meal planner: guide/meal-plan.md
      - Shopping lists: guide/shopping.md
      - Importing recipes: guide/importing.md
      - Printable cookbook: guide/cookbook.md
      - Backup & restore: guide/backup.md
      - AI assist: guide/ai.md
      - Households & sharing: guide/households.md
      - Settings: guide/settings.md
      - Standalone mode: guide/standalone.md
      - Offline use & sync: guide/offline.md
  - Administration:
      - admin/index.md
      - Configuration reference: admin/configuration.md
      - Docker & Compose: admin/docker.md
      - PostgreSQL: admin/postgres.md
      - Reverse proxy & HTTPS: admin/reverse-proxy.md
      - Single sign-on (OIDC): admin/oidc.md
      - Users & administration: admin/users.md
      - Backups & upgrades: admin/backups.md
      - Security: admin/security.md
  - Reference:
      - reference/index.md
      - HTTP API: reference/api.md
      - On-device engine: reference/engine.md
      - Import formats: reference/import-formats.md
      - Ingredient parsing & units: reference/ingredients.md
  - Development:
      - development/index.md
      - Architecture: development/architecture.md
      - Building from source: development/building.md
      - Testing: development/testing.md
      - Contributing: development/contributing.md
  - FAQ & troubleshooting: faq.md
